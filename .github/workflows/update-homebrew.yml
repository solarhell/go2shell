name: Update Homebrew Cask

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 (例如: v1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        id: validate-tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="$(printf '%s' "$VERSION" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"

          if [[ -z "$VERSION" ]]; then
            echo "Error: tag input is empty"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: invalid tag format: $VERSION"
            exit 1
          fi

          echo "Using tag: $VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        run: |
          set -euo pipefail
          VERSION="${{ steps.validate-tag.outputs.tag }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          curl -fsSL "${BASE_URL}/go2shell-macOS-arm64.zip.sha256" -o sha256.arm64
          curl -fsSL "${BASE_URL}/go2shell-macOS-x86_64.zip.sha256" -o sha256.x86_64

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION_NUM="${VERSION#v}"

          SHA256_ARM64=$(tr -d '\n\r' < sha256.arm64)
          SHA256_X86_64=$(tr -d '\n\r' < sha256.x86_64)

          for sha in "$SHA256_ARM64" "$SHA256_X86_64"; do
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Error: invalid checksum: $sha"
              exit 1
            fi
          done

          git clone --depth 1 "https://git:${GH_TOKEN}@github.com/solarhell/homebrew-tap.git"

          CASK=homebrew-tap/Casks/solarhell-go2shell.rb
          if [[ ! -f "$CASK" ]]; then
            echo "Error: $CASK not found in the tap"
            exit 1
          fi

          # The cask file in the tap is the source of truth. Only the version and
          # the two checksums are rewritten here; everything else (caveats,
          # depends_on, name, ...) stays under manual control in the tap repo.
          VERSION_NUM="$VERSION_NUM" \
          SHA_ARM="$SHA256_ARM64" \
          SHA_INTEL="$SHA256_X86_64" \
          python3 - "$CASK" <<'PY'
          import os
          import re
          import sys

          path = sys.argv[1]
          version = os.environ["VERSION_NUM"]
          sha_arm = os.environ["SHA_ARM"]
          sha_intel = os.environ["SHA_INTEL"]

          def rewrite(text, pattern, value, what):
              new, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + value + m.group(2),
                  text,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  sys.exit(
                      f"error: could not update {what} in {path}. "
                      f"The cask layout changed; update this workflow to match."
                  )
              return new

          src = open(path, encoding="utf-8").read()
          src = rewrite(src, r'^(\s*version\s+")[^"]*(")', version, "version")
          src = rewrite(src, r'^(\s*sha256\s+arm:\s+")[0-9a-fA-F]{64}(")', sha_arm, "arm sha256")
          src = rewrite(src, r'^(\s*intel:\s+")[0-9a-fA-F]{64}(")', sha_intel, "intel sha256")
          open(path, "w", encoding="utf-8").write(src)
          PY

          echo "Updated cask:"
          cat "$CASK"

          cd homebrew-tap
          if git diff --quiet; then
            echo "Cask already up to date, nothing to commit"
            exit 0
          fi

          git diff
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/solarhell-go2shell.rb
          git commit -m "Update go2shell to ${VERSION}"
          git push
